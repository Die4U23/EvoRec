<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvoRec 项目图册</title><style>body{max-width:1120px;margin:40px auto;padding:0 20px;font:16px/1.8 system-ui,'Microsoft YaHei',sans-serif;color:#203d50;background:#f5f7fa}figure{background:white;padding:20px;margin:24px 0;border-radius:14px}img{width:100%;height:auto}figcaption{margin-top:12px}a{color:#17658c}</style></head><body><h1>EvoRec 项目图册</h1><p>10 张可追溯配图：模型结构、实验过程与策略取舍。数据来自本地已完成的实验；不同阶段的用户样本不同。</p><figure><h2>内容双塔结构与实现边界</h2><img src="content-tower-architecture.png" alt="内容双塔结构与实现边界" loading="lazy"><figcaption>图中为已运行的离线结构；R03 训练，R04 冻结复用。在线业务接入仍是计划。 <a href="content-tower-architecture.svg">SVG 矢量图</a></figcaption></figure><figure><h2>冷商品保留与门控流程</h2><img src="cold-reservation-flow.png" alt="冷商品保留与门控流程" loading="lazy"><figcaption>五种策略在实验前固定。门控只读取历史信号；未跳过任一检索路径。 <a href="cold-reservation-flow.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R04 冷商品落选位置分析</h2><img src="r04-error-localization.png" alt="R04 冷商品落选位置分析" loading="lazy"><figcaption>测试后诊断：比较同一批冷目标的命中位置；排序集合可能交叉，不是严格漏斗。 <a href="r04-error-localization.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R02 序列模型训练曲线</h2><img src="r02-learning-curves.png" alt="R02 序列模型训练曲线" loading="lazy"><figcaption>R02：39 轮、4 次训练。损失下降不保证验证指标持续改善。 <a href="r02-learning-curves.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R02 序列模型与统计基线</h2><img src="r02-test-comparison.png" alt="R02 序列模型与统计基线" loading="lazy"><figcaption>R02 独立样本。三种子标准差不是置信区间；序列模型未超过强协同基线。 <a href="r02-test-comparison.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R03 内容双塔训练曲线</h2><img src="r03-learning-curves.png" alt="R03 内容双塔训练曲线" loading="lazy"><figcaption>R03：48 轮、4 次训练。按验证指标保留检查点；静态内容可用假设。 <a href="r03-learning-curves.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R03 整体排序与冷商品召回</h2><img src="r03-test-comparison.png" alt="R03 整体排序与冷商品召回" loading="lazy"><figcaption>R03 独立样本。内容融合改善整体排序，但冷商品命中少于纯内容路径。 <a href="r03-test-comparison.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R04 验证集策略比较</h2><img src="r04-validation.png" alt="R04 验证集策略比较" loading="lazy"><figcaption>R04 冻结 R03 模型，使用新用户验证选择策略；红线为整体 NDCG 下限。 <a href="r04-validation.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R04 测试集消融</h2><img src="r04-test-ablation.png" alt="R04 测试集消融" loading="lazy"><figcaption>固定 seed 17 的五种预登记策略；测试中的差异不用于回改选型。 <a href="r04-test-ablation.svg">SVG 矢量图</a></figcaption></figure><figure><h2>R04 门控活动与冷商品曝光</h2><img src="r04-gate-activity.png" alt="R04 门控活动与冷商品曝光" loading="lazy"><figcaption>改变列表的请求比例和新增冷商品位置数量，与目标命中率分别评价。 <a href="r04-gate-activity.svg">SVG 矢量图</a></figcaption></figure><p><a href="manifest.json">来源清单</a> · <a href="../../evorec-project-log.md">项目实录</a></p></body></html>
