name: Service integration

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  service-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evorec_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evorec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVOREC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evorec_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install service and test dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .
      - name: Install PostgreSQL backup client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Check dependencies and migrations
        run: |
          python -m pip check
          python scripts/migrate_database.py
          python scripts/migrate_database.py --check
      - name: Run service tests against PostgreSQL
        run: |
          python -m pytest -q -ra --junitxml=service-tests.xml \
            tests/test_api.py tests/test_experiment_page.py tests/test_architecture.py \
            tests/test_bundle_validation.py tests/test_contracts.py \
            tests/test_catalog_file.py tests/test_catalog_file_jobs.py \
            tests/test_backup_restore.py \
            tests/test_catalog_build.py \
            tests/test_feedback.py tests/test_management.py tests/test_catalog_lock.py \
            tests/test_migrations.py tests/test_model_runtime.py \
            tests/test_residual_ranker_runtime.py tests/test_r06_features_runtime.py \
            tests/test_content_encoder_runtime.py \
            tests/test_r06_retrieval_runtime.py \
            tests/test_r06_serving.py \
            tests/test_r06_bundle.py \
            tests/test_r06_catalog_preparation.py \
            tests/test_r06_async.py \
            tests/test_r06_online.py \
            tests/test_r06_membership_profile.py \
            tests/test_r06_profile.py \
            tests/test_r06_tcp_profile.py \
            tests/test_r06_tcp_control.py \
            tests/test_r06_phase_gate.py \
            tests/test_database_handshake.py \
            tests/test_r06_demo.py \
            tests/test_r06_reliability.py \
            tests/test_evaluation_jobs.py \
            tests/test_catalog_demo.py \
            tests/test_recommendation_recovery.py \
            tests/test_session_admission_lock.py \
            tests/test_postgres_api.py tests/test_recommendation.py \
            tests/test_strategy_comparison.py \
            tests/test_comparison_jobs.py \
            tests/test_repository_hygiene.py tests/test_v01_experience.py
          python -c 'import xml.etree.ElementTree as ET; suite = ET.parse("service-tests.xml").getroot().find("testsuite"); assert int(suite.attrib["skipped"]) == 0, "service tests must not skip"'
      - name: Run local page interaction tests
        run: |
          node --test tests/web_file_import.test.cjs tests/web_results.test.cjs
          node --test tests/web_evaluations.test.cjs
      - name: Check exported API contracts
        env:
          EVOREC_DATABASE_URL: ""
        run: |
          python scripts/export_contracts.py
          git diff --exit-code -- docs/contracts

  retrieval-accelerated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional CPU retrieval environment
        run: |
          python -m pip install -r requirements-retrieval.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Verify accelerated numerical parity without research dependencies
        run: |
          python -m pytest -q -ra --junitxml=accelerated-tests.xml \
            tests/test_r06_retrieval_numpy.py tests/test_r06_retrieval_runtime.py \
            tests/test_r06_retrieval_benchmark.py
          python -m pytest -q -ra --junitxml=ranker-accelerated-tests.xml tests/test_residual_ranker_numpy.py
          python -c 'import xml.etree.ElementTree as ET; s = ET.parse("ranker-accelerated-tests.xml").getroot().find("testsuite"); assert int(s.attrib["tests"]) > 0 and all(int(s.attrib[k]) == 0 for k in ("errors", "failures", "skipped")), "accelerated ranker must pass without skips"'
          python -c 'import xml.etree.ElementTree as ET; s = ET.parse("accelerated-tests.xml").getroot().find("testsuite"); assert int(s.attrib["tests"]) > 0 and all(int(s.attrib[k]) == 0 for k in ("errors", "failures", "skipped")), "acceleration tests must pass without skips"'
